name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Tor Expert Bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-tor.ps1

      - name: Build Veil and installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Checksums
        shell: powershell
        run: |
          Get-FileHash Veil.exe, Veil-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-${{ github.sha }}
          path: |
            Veil.exe
            Veil-Setup.exe
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag Veil-Setup.exe Veil.exe SHA256SUMS.txt `
            --title "Veil $tag" --notes-file docs/release-notes.md
